name: PN release validation

on:
  workflow_dispatch:
  push:
    branches: [main, 'improvements-*', 'server-improvements-*', 'release/**']
    paths: ['src/**', 'db/**', 'npc/**', 'conf/**', 'sql-files/**', 'tools/**', 'client-patch/**', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'db/**', 'npc/**', 'conf/**', 'sql-files/**', 'tools/**', 'client-patch/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  transaction-sql:
    name: Durable purchase SQL recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOOLCHAIN: pn-transaction-ci:${{ github.sha }}
      DATABASE_IMAGE: mariadb@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    steps:
      - uses: actions/checkout@v4
      - name: Build the transaction test toolchain
        run: |
          docker build -t "$TOOLCHAIN" -f tools/ci/Dockerfile.transaction-tests tools/ci
          docker pull "$DATABASE_IMAGE"
      - name: Build current character, login and map server objects
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/rathena" \
            "$TOOLCHAIN" sh -ec './configure --enable-prere=no --enable-packetver=20260219 --without-pcre && make import && make -j2 char login map'
      - name: Prove atomicity, replay, ownership, concurrency and database restart
        run: |
          python3 tools/ci/shop_recovery_sql_test.py \
            --candidate "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/transaction-sql" \
            --image "$TOOLCHAIN" --database-image "$DATABASE_IMAGE"
      - name: Prove achievement snapshot rollback and database-crash recovery
        run: |
          python3 tools/ci/achievement_sql_test.py \
            --candidate "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/achievement-sql" \
            --image "$TOOLCHAIN" --database-image "$DATABASE_IMAGE"
      - name: Prove character-save rollback and database-crash recovery
        run: |
          python3 tools/ci/char_save_sql_test.py \
            --candidate "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/character-save-sql" \
            --image "$TOOLCHAIN" --database-image "$DATABASE_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transaction-sql-recovery
          path: ${{ runner.temp }}/transaction-sql/
      - name: Prove registry receipts, ordering and database-crash recovery
        run: |
          python3 tools/ci/registry_save_sql_test.py \
            --candidate "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/registry-save-sql" \
            --image "$TOOLCHAIN" --database-image "$DATABASE_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-save-sql-recovery
          path: ${{ runner.temp }}/registry-save-sql/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: achievement-sql-recovery
          path: ${{ runner.temp }}/achievement-sql/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-save-sql-recovery
          path: ${{ runner.temp }}/character-save-sql/
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build and regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmysqlclient-dev zlib1g-dev libpcre3-dev libssl-dev libzstd-dev python3-yaml lua5.1
          sudo systemctl start mysql.service
      - name: Build the configured Renewal candidate
        run: |
          # Match the deployed build. BUILDBOT treats even documented, bounded
          # value warnings as process failures; release_checks retains strict
          # exit/error/SQL/readiness checks and publishes the complete startup log.
          # Keep SQL conversion noninteractive independently of runtime diagnostics.
          CPPFLAGS=-DCONVERT_ALL ./configure --enable-prere=no --enable-packetver=20260219 --enable-buildbot=no
          make import
          make -j2 tools map
          ./yaml2sql
          python3 - <<'PY'
          from pathlib import Path
          for name in ('mob_db_re.sql', 'mob_db2_re.sql'):
              assert 'REPLACE INTO ' in Path('sql-files', name).read_text(), f'SQL export was skipped: {name}'
          PY
          ./tools/ci/sql.sh
      - name: Run release gates
        env:
          LUA51: /usr/bin/lua5.1
        run: python3 tools/ci/release_checks.py --startup-log release-results/startup.log --report release-results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: release-results/
