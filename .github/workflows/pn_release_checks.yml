name: PN release validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'db/**', 'npc/**', 'conf/**', 'sql-files/**', 'tools/**', 'client-patch/**', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'db/**', 'npc/**', 'conf/**', 'sql-files/**', 'tools/**', 'client-patch/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build and regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmysqlclient-dev zlib1g-dev libpcre3-dev libssl-dev python3-yaml
          sudo systemctl start mysql.service
      - name: Build the configured Renewal candidate
        run: |
          # Match the deployed build. BUILDBOT treats even documented, bounded
          # value warnings as process failures; release_checks retains strict
          # exit/error/SQL/readiness checks and publishes the complete startup log.
          # Keep SQL conversion noninteractive independently of runtime diagnostics.
          CPPFLAGS=-DCONVERT_ALL ./configure --enable-prere=no --enable-packetver=20260219 --enable-buildbot=no
          make import
          make -j2 tools map
          ./yaml2sql
          python3 - <<'PY'
          from pathlib import Path
          for name in ('mob_db_re.sql', 'mob_db2_re.sql'):
              assert 'REPLACE INTO ' in Path('sql-files', name).read_text(), f'SQL export was skipped: {name}'
          PY
          ./tools/ci/sql.sh
      - name: Run release gates
        run: python3 tools/ci/release_checks.py --startup-log release-results/startup.log --report release-results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: release-results/
