name: PN Windows client preflight
on:
  workflow_dispatch:
  pull_request:
    paths: ['client-patch/client_usability/**', 'tools/ci/client_*', '.github/workflows/pn_client_preflight.yml']
  push:
    branches: [main, 'codex/server-improvements-*', 'release/**']
    paths: ['client-patch/client_usability/**', 'tools/ci/client_*', '.github/workflows/pn_client_preflight.yml']
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and shipping PowerShell client checks
        shell: pwsh
        run: |
          python tools/ci/client_preflight_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/client_archive_stack_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/client_launcher_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/client_manifest_test.py
          exit $LASTEXITCODE
