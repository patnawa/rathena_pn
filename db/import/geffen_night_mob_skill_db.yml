# MACHINE-READABLE CLEAN-ROOM SKILL MANIFEST
#
# This repository revision still loads mob skills from mob_skill_db.txt; it has
# no MOB_SKILL_DB YAML loader.  This isolated YAML intentionally stages the GPL
# rAthena Tournament skill rows without altering that shared legacy file.  It is
# valid YAML, but must be converted to the documented 19-column TXT format (or
# loaded by a future YAML loader) before the skills become active.  Ordinary
# attacks remain available in the first release even when this manifest is not
# wired.  SourceMobId documents the GPL-safe provenance of every copied row.
# Skill rows are [state, skill id, level, rate/10000, cast ms, delay ms,
# cancelable, target, condition, condition value]; omitted TXT value/emotion/chat
# columns are empty, matching the source rows.

