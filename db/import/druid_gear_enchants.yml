Header:
  Type: ITEM_DB
  Version: 3

Body:
  - Id: 314269
    AegisName: Gear_AT2
    Name: Pinion Shot Tuning Device
    Type: Card
    SubType: Enchant
    Script: |
      .@g = getenchantgrade();
      bonus2 bSkillAtk,"AT_PINION_SHOT",5;
      if (.@g >= ENCHANTGRADE_D)
        bonus2 bSkillAtk,"AT_PINION_SHOT",3;
      if (.@g >= ENCHANTGRADE_C)
        bonus2 bAddSize,Size_All,10;
      if (.@g >= ENCHANTGRADE_B)
        bonus2 bSkillAtk,"AT_PINION_SHOT",4;
      if (.@g >= ENCHANTGRADE_A)
        bonus2 bSkillAtk,"AT_PINION_SHOT",6;
