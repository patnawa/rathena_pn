# Tomb of Remorse monster IDs and sprites are present in the shipped client,
# and the same IDs are reserved (but commented out) in rAthena's main mob DB.
#
# COMPATIBILITY POLICY -- NOT CANONICAL GRAVITY BALANCE DATA:
# Gravity's public dungeon notices name the monsters, but do not publish their
# complete stat/skill/drop arrays. These conservative Lv.220-party baselines
# make the instance playable until a licensed packet/database source is made
# available. EXP and drops are deliberately zero; the official, known Mineas
# quest rewards are issued by the NPC script. No unpublished random Mineas or
# card rate is invented here.
