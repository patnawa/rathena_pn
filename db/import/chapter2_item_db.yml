    EquipLevelMin: 230
    Locations:
      Armor: true
    Refineable: true
    Gradable: true
    Script: |
      .@r = getrefine();
      .@g = getenchantgrade();
      bonus bPAtk,0;
      bonus bBaseAtk,130+15*(.@r/2);
      bonus bDef,15*(.@r/2);
      if (.@r>=7) { bonus bShortAtkRate,5; bonus bLongAtkRate,5; bonus bAspdRate,10; }
