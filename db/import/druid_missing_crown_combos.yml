# Additive reviewed definitions; see doc/druid_missing_crowns_audit.md.
Header:
  Type: COMBO_DB
  Version: 1
Body:
- Combos:
  - Combo:
    - Sky_Rune_Crown_SHC
    - Sky_Slasher_Katar
  Script: |
    .@sum = getequiprefinerycnt(EQI_HEAD_TOP)+getequiprefinerycnt(EQI_HAND_R);
    bonus2 bSkillAtk,"SHC_SAVAGE_IMPACT",20;
    bonus bCritAtkRate,20;
    if (getenchantgrade(EQI_HEAD_TOP)>=ENCHANTGRADE_A && getskilllv("SHC_SAVAGE_IMPACT")>=10 && .@sum>=24 && getenchantgrade(EQI_HAND_R)>=ENCHANTGRADE_A) {
      bonus2 bSkillCooldown,"SHC_SAVAGE_IMPACT",-200;
      bonus bShortAtkRate,10;
    }
