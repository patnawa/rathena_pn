- Id: 400999
  AegisName: Time_DM_R_Crown_AT
  Name: Time Dimensions Rune Crown (Alitea)
  Type: Armor
  Defense: 50
  Weight: 0
  Slots: 1
  Jobs:
    Alitea: true
  Classes:
    Fourth: true
  Locations:
    Head_Top: true
  ArmorLevel: 2
  EquipLevelMin: 250
  Refineable: true
  Gradable: true
  View: 2441
  Script: |
    .@r = getrefine();
    .@g = getenchantgrade();
    bonus bMaxHP,120*(.@r/2);
    bonus bMaxSP,30*(.@r/2);
    bonus bAtkRate,2*(.@r/3);
    bonus2 bSkillAtk,"AT_FRENZY_FANG",5*(.@r/4);
    bonus2 bSkillAtk,"AT_QUILL_SPEAR",5*(.@r/4);
    if (.@r>=7) {
      bonus bShortAtkRate,10;
      bonus bLongAtkRate,10;
    }
    if (.@r>=9) {
      bonus bPAtk,5;
    }
    if (.@r>=10) {
      bonus2 bAddRace,RC_All,15;
      bonus2 bAddRace,RC_Player_Human,-15;
      bonus2 bAddRace,RC_Player_Doram,-15;
    }
    if (.@r>=11) {
      bonus bCritical,10;
      bonus bFixedCast,-500;
    }
    if (.@g>=ENCHANTGRADE_D) {
      bonus bPAtk,3;
    }
    if (.@g>=ENCHANTGRADE_C) {
      bonus bMaxHPrate,3;
      bonus bMaxSPrate,3;
    }
    if (.@g>=ENCHANTGRADE_B) {
      bonus bShortAtkRate,10;
      bonus bLongAtkRate,10;
    }
    if (.@g>=ENCHANTGRADE_A) {
      bonus2 bAddSize,Size_All,15;
    }
