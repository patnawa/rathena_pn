# factual data cross-checked against the client enum placeholders, Divine Pride's
# current iRO records, and the public iRO Wiki. No third-party script source was
# copied. AI/animation timing is a normalized rAthena compatibility baseline.
# Regular tower monsters intentionally have no loot table; reward delivery is
# deterministic in the companion NPC script because official rates are not published.
#
# Integration note: rAthena only auto-loads db/import/mob_db.yml. This uniquely named
# staging file must be explicitly merged/imported by the integrator.
