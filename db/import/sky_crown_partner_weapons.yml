- Id: 610093
  AegisName: Sky_Slasher_Katar
  Name: Sky Slasher Katar
  Type: Weapon
  SubType: Katar
  Weight: 2000
  Attack: 310
  Range: 1
  Slots: 2
  Jobs:
    Assassin: true
  Classes:
    Fourth: true
  Locations:
    Both_Hand: true
  WeaponLevel: 5
  EquipLevelMin: 240
  Refineable: true
  Gradable: true
  Script: |
    .@r = getrefine();
    .@g = getenchantgrade();
    bonus bCritical,5;
    bonus2 bSkillAtk,"SHC_SAVAGE_IMPACT",15;
    bonus bBaseAtk,35*(.@r/3);
    bonus bCritAtkRate,3*(.@r/3);
    bonus2 bSkillAtk,"SHC_SAVAGE_IMPACT",7*(.@r/4);
    if (.@r>=7) {
      bonus bCritAtkRate,25;
    }
    if (.@r>=9) {
      bonus bCritical,10;
      bonus bPAtk,5;
    }
    if (.@r>=11) {
      bonus bCritical,5;
      bonus2 bSkillAtk,"SHC_SAVAGE_IMPACT",10;
    }
    if (.@g>=ENCHANTGRADE_D) {
      bonus bAtkRate,5;
    }
    if (.@g>=ENCHANTGRADE_C) {
      bonus2 bSkillAtk,"SHC_SAVAGE_IMPACT",10;
    }
    if (.@g>=ENCHANTGRADE_B) {
      bonus bCritical,5;
      bonus bCRate,7;
    }
    if (.@g>=ENCHANTGRADE_A) {
      bonus bPAtk,10;
    }
