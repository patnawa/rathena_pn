# Airship Crash / Aircraft Crash Site quest IDs from the shipped client.
#
# Quest 5909 is intentionally not given a static TimeLimit.  The published
# rule is one entry every three days, resetting at 04:00; a fixed YAML
# duration cannot express that wall-clock boundary exactly.  AirshipCrash.txt
# maintains the character timestamp and uses 5909 as its visible standby
# marker.
